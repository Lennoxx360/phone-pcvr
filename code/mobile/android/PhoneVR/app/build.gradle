import com.android.build.gradle.internal.dsl.PackagingOptions

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply from: '../versioning.gradle'
apply plugin: "com.diffplug.spotless"

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

def defaultALVRFlavour = "--release"

// Phone PCVR release key: kept outside the repo (default ~/.phonepcvr/signing.properties,
// or the path in PHONEPCVR_SIGNING). Keys: storeFile, storePassword, keyAlias, keyPassword.
// Lose the keystore and installed copies can't be updated in place, so back it up.
def ownSigningFile = new File(System.getenv("PHONEPCVR_SIGNING") ?: "${System.getProperty('user.home')}/.phonepcvr/signing.properties")
def ownSigning = new Properties()
if (ownSigningFile.exists()) ownSigningFile.withInputStream { ownSigning.load(it) }

android {
    signingConfigs {
        releaseconfig {
            if (ownSigningFile.exists()) {
                storeFile new File(ownSigning['storeFile'])
                storePassword ownSigning['storePassword']
                keyAlias ownSigning['keyAlias']
                keyPassword ownSigning['keyPassword']
                println "[PVR] Signing release with the Phone PCVR key from $ownSigningFile"
            }
            else if( System.getenv('GITHUB_EVENT_NAME') == 'pull_request' || System.getenv("Store") == null || System.getenv("Key") == null ) {
                // If its a PR Supply a dummy KeySigningConfig
                // Or in Local env if Store and Keys are not present in ENV Vars do the same
                storeFile file("PhoneVRKeyStorePR.jks")
                storePassword "test1234"
                keyAlias "PhoneVRKeyPR"
                keyPassword "test1234"
                println "[PVR] Configuring releaseconfigs for testing a PR..."
            }
            else {
                storeFile file(keystoreProperties['storeFile'])
                storePassword System.getenv("Store")
                keyAlias keystoreProperties['keyAlias']
                keyPassword System.getenv("Key")
                println "[PVR] Configuring releaseconfigs for release (push) (not a PR)"
            }
        }
    }
    compileSdkVersion 34
    namespace 'io.github.lennoxx360.phonepcvr'
    ndkVersion '25.2.9519653' // r25c
    defaultConfig {
        applicationId "io.github.lennoxx360.phonepcvr"
        minSdkVersion 24
        targetSdkVersion 33
        versionCode buildVersionCode()
        versionName buildVersionName()

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments useTestStorageService: 'true'

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fexceptions -frtti" //-DANDROID_USE_LEGACY_TOOLCHAIN_FILE=ON"
            }
        }

        defaultPublishConfig 'release'
        publishNonDefault true
        archivesBaseName = "PhonePCVR-v$versionName"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            debuggable false
            signingConfig signingConfigs.releaseconfig
        }
        debug {
            debuggable true
            jniDebuggable true
            renderscriptDebuggable true
            minifyEnabled false
            externalNativeBuild {
                cmake {
                    cppFlags += "-D_DEBUG=1"
                }
            }
            defaultALVRFlavour = ""
        }
    }
    buildFeatures {
        buildConfig = true // TODO: Remove BuildConfig, Gradle suggests this usage is inefficient > v8 disabled by default
        viewBinding true
    }
    testOptions {
        // JVM unit tests may touch android.util.Log (PcAssistTest): no-ops instead of errors
        unitTests.returnDefaultValues = true
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ["libraries/jni", "../ALVR/build/alvr_client_core"]
        }
    }
    externalNativeBuild {
        cmake {
            // version "3.6.4"
            path "CMakeLists.txt"
        }
    }
    // CompileOptions required for ARCA
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    // MediaPipe memory-maps its model from the APK.
    androidResources {
        noCompress 'task'
    }

    packagingOptions {
        jniLibs.useLegacyPackaging = true
        gradle.startParameter.getTaskNames().each { task ->
            println("[PVR] task is " + task)
            if (task.contains('debug') || task.contains('Debug')) {
                def android = project.extensions.findByName("android")

                if(android != null) {
                    PackagingOptions packagingOptions = android["packagingOptions"]

                    if (packagingOptions != null) {
                        packagingOptions.doNotStrip = [ "**/*.so" ]
                    }
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'com.google.android.material:material:1.6.1'

    implementation "androidx.tracing:tracing:1.1.0"
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation "androidx.test.ext:junit-ktx:$extJUnitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$espressoVersion"
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    androidTestImplementation "androidx.test:rules:$androidXTestVersion"
    androidTestUtil "androidx.test.services:test-services:$servicesVersion"

    implementation 'com.google.cardboard.sdk:cardboard-sdk:1.17.0@aar'
    implementation 'io.github.zxing-cpp:android:2.3.0' // was 2.3.0-SNAPSHOT; Sonatype s01 snapshots repo is gone
    implementation 'com.google.protobuf:protobuf-javalite:3.19.4'
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'com.google.ar:core:1.57.0'
    implementation 'com.google.mediapipe:tasks-vision:0.10.26.1'

}

// The dependencies for NDK builds live inside the .aar files so they need to
// be extracted before NDK targets can link against.
task extractNdk(type: Copy)  {
    copy {
        from zipTree("../cardboard/cardboard-sdk.aar")
        into "libraries/"
        include "jni/**/libGfxPluginCardboard.so"
    }
}

task deleteNdk(type: Delete) {
    delete "libraries/"
    delete "../ALVR/build/"
    delete "../ALVR/target/"
}

task buildClientLib {
    doLast {
        exec {
            workingDir '../ALVR'
            // Panic messages embed source paths; map the home folder (cargo registry) and the
            // repo away so the APK doesn't carry the build machine's user or folder names.
            environment 'CARGO_ENCODED_RUSTFLAGS', [
                "--remap-path-prefix=${System.getProperty('user.home')}=~",
                "--remap-path-prefix=${file('../../../../..').canonicalPath}=.",
            ].join('\u001f')
            if(defaultALVRFlavour.length() > 0)
                commandLine 'cargo', 'xtask', 'build-client-lib', '--no-stdcpp', defaultALVRFlavour
            else
                commandLine 'cargo', 'xtask', 'build-client-lib', '--no-stdcpp'
        }
    }
}

spotless {
    java {
        // don't need to set target, it is inferred from java
        // fix formatting of type annotations
        target '**/*.java'
        formatAnnotations()
        removeUnusedImports()
        // apply a specific flavor of google-java-format
        googleJavaFormat().aosp().reflowLongStrings()
        // make sure every file has the following copyright header.
        // optionally, Spotless can set copyright years by digging
        // through git history (see "license" section below)
        licenseHeader '/* (C)$YEAR */'
    }
    kotlin {
        // by default the target is every '.kt' and '.kts` file in the java sourcesets
        target '**/*.kt'
        ktfmt().dropboxStyle()    // has its own section below
        licenseHeader '/* (C)$YEAR */' // or licenseHeaderFile
    }
}

// MediaPipe hand landmark model (Apache-2.0), fetched at build time instead of committed.
task downloadHandModel {
    def model = file("src/main/assets/hand_landmarker.task")
    outputs.file(model)
    onlyIf { !model.exists() }
    doLast {
        model.parentFile.mkdirs()
        new URL("https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task")
                .withInputStream { i -> model.withOutputStream { it << i } }
    }
}

preBuild.dependsOn(downloadHandModel)
preBuild.dependsOn(buildClientLib)
preBuild.dependsOn("spotlessCheck")

build.dependsOn(extractNdk)
build.dependsOn(buildClientLib)

clean.dependsOn(deleteNdk)
